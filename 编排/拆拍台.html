<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#232326">
<title>拆拍台</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f4f0; --panel:#ffffff; --panel2:#efede7; --line:#dad6cd; --text:#23221f; --muted:#7a766e;
  --accent:#b4532a; --accent2:#2f6db0; --warn:#c0392b; --warnbg:#fbe7e3; --hint:#a07800; --ok:#2e7d32;
  --see:#6b7a8f; --do:#b4532a; --choose:#7b3fa0; --skip:#9a9a9a; --link:#fff1c2; --sel:#e3edf9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1a1a1c; --panel:#232326; --panel2:#2c2c30; --line:#3a3a40; --text:#e7e5e0; --muted:#9b978f;
    --accent:#e07a4c; --accent2:#6fa8e8; --warn:#ef6f5e; --warnbg:#3b2421; --hint:#d9b84a; --ok:#6cc070;
    --see:#8797ad; --do:#d9703f; --choose:#a877cc; --skip:#6f6f6f; --link:#3a3320; --sel:#22344b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.55 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
select:focus{outline:none;border-color:var(--accent2)}
select:disabled{opacity:.5}
option,optgroup{background:var(--panel);color:var(--text)}
input[type=checkbox]{accent-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50}
.modal{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:14px 16px;width:min(560px,calc(100vw - 32px));max-height:80vh;overflow:auto}
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{pointer-events:auto;padding:9px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;cursor:pointer;max-width:min(680px,calc(100vw - 32px))}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--warn);color:#fff}
.toast.info{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.pick{padding:7px 8px;border-radius:5px;cursor:pointer}
.pick:hover{background:var(--sel)}
header{min-height:50px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:700;color:var(--accent);margin-right:4px}
#titleSlot input{width:220px;font-weight:600}
.status{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.status .dirty{color:var(--hint)} .status .saved{color:var(--ok)} .status .err{color:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 10px;cursor:pointer;white-space:nowrap;flex:none}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn.sm{padding:0 7px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(300px,32%) 1fr;flex:1;min-height:0}
#outline{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:6px 0 40px}
#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:5px 12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--text);font-weight:600;margin-bottom:-1px}
.tcount{margin-left:4px;font-size:11px;background:var(--warn);color:#fff;border-radius:8px;padding:0 5px}
.tcount:empty{display:none}
#view{flex:1;overflow:auto;padding:16px 20px 80px;min-height:0}

/* ===== 触屏：点击目标放大（不论宽窄，折叠屏内屏也是触屏） ===== */
@media (pointer: coarse){
  button,.tab,.pick,.bchip,.brow,.iss,.refline,.lc.beatcell,.lc.trend{touch-action:manipulation}
  .btn{min-height:40px;padding:6px 14px}
  .btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
  .seg button{min-height:40px;padding:6px 14px}
  .tab{padding:10px 14px}
  .row{min-height:46px}
  .otext{padding:9px 4px}
  .inp,.ta,.otext,select{font-size:16px}
  select{min-height:40px}
  input[type=checkbox]{width:22px;height:22px}
  .checkline{min-height:40px}
  .pick{padding:13px 10px}
  .bchip{padding:8px 8px}
  .brow,.iss,.refline{padding:10px 8px}
  .x{padding:8px 10px}
  .lc.trend{min-height:48px}
  .tog{width:30px;height:40px;display:grid;place-items:center;font-size:16px}
  details.ask summary{padding:8px 0}
}
/* ===== 外壳：返回、菜单、底部导航 ===== */
.iconbtn{display:none;align-items:center;justify-content:center;min-width:40px;font-size:18px;line-height:1}
.bbar{display:none}
.row .go{display:none;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;width:36px;height:40px;flex:none;align-items:center;justify-content:center}
header{padding-top:max(7px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.outline-actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:1}

/* ===== 折叠屏展开 / 平板（600–1023px）：左右两栏，顶栏精简 ===== */
body[data-layout="fold"] .layout{grid-template-columns:minmax(260px,38%) 1fr}
body[data-layout="fold"] header .hx{display:none}
body[data-layout="fold"] #bMenu{display:inline-flex}
body[data-layout="fold"] #titleSlot input{width:180px}
body[data-layout="fold"] .status{min-width:0;flex:1 1 120px}
body[data-layout="fold"] #tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
body[data-layout="fold"] #tabs::-webkit-scrollbar{display:none}
body[data-layout="fold"] .tab{flex:none}
body[data-layout="fold"] .chain{grid-template-columns:1fr !important}
body[data-layout="fold"] .chain .arrow{display:none}
body[data-layout="fold"] .arc{grid-template-columns:1fr 1fr}
body[data-layout="fold"] .outline-head .hint{display:none}
body[data-layout="fold"] #view{padding:14px 14px 40px}

/* ===== 手机（<600px，含折叠屏外屏）：大纲 / 内容两屏切换 + 底部导航 ===== */
body[data-layout="phone"]{--lanelab:92px}
body[data-layout="phone"] .layout{grid-template-columns:1fr}
body[data-layout="phone"][data-mview="outline"] #work{display:none}
body[data-layout="phone"][data-mview="work"] #outline{display:none}
body[data-layout="phone"] #outline{border-right:0;padding-bottom:0}
body[data-layout="phone"] #tabs{display:none}
body[data-layout="phone"] header{gap:6px;padding-bottom:6px}
body[data-layout="phone"] header .hx,body[data-layout="phone"] .brand{display:none}
body[data-layout="phone"] #bMenu{display:inline-flex}
body[data-layout="phone"][data-mview="work"] #bBack{display:inline-flex}
body[data-layout="phone"] #titleSlot{flex:1;min-width:0}
body[data-layout="phone"] #titleSlot input{width:100%;font-size:16px}
body[data-layout="phone"] .spacer{display:none}
body[data-layout="phone"] .status{flex-basis:100%;order:10;white-space:normal;font-size:12px;line-height:1.4}
body[data-layout="phone"] .outline-head{display:none}
body[data-layout="phone"] .row{padding-right:2px}
body[data-layout="phone"] .row.beat{padding-left:22px}
body[data-layout="phone"] .row .go{display:inline-flex}
body[data-layout="phone"] .row .num{min-width:34px;cursor:default}
body[data-layout="phone"] .chip{max-width:72px}
body[data-layout="phone"] .grid2,body[data-layout="phone"] .grid4,body[data-layout="phone"] .arc,body[data-layout="phone"] .chain{grid-template-columns:1fr !important}
body[data-layout="phone"] .chain .arrow{display:none}
body[data-layout="phone"] #view{padding:10px 10px 28px}
body[data-layout="phone"] .sec{padding:12px;border-radius:10px;margin-bottom:10px}
body[data-layout="phone"] .toolbar{gap:6px}
body[data-layout="phone"] .formula{flex-wrap:wrap}
body[data-layout="phone"] .formula .inp{flex:1 1 40%}
body[data-layout="phone"] .fromto{flex-wrap:wrap}
body[data-layout="phone"] .fromto .inp{flex:1 1 40%}
body[data-layout="phone"] .laneedit{grid-template-columns:1fr;gap:4px}
body[data-layout="phone"] .lanes-scroll{max-height:none}
body[data-layout="phone"] .lanemgr{flex-direction:column;align-items:stretch}
body[data-layout="phone"] .lanechip{flex-wrap:wrap}
body[data-layout="phone"] .mechhead{flex-wrap:wrap}
body[data-layout="phone"] .sent{flex-direction:column}
body[data-layout="phone"] .sent .acts{max-width:none;justify-content:flex-start}
body[data-layout="phone"] .park{flex-wrap:wrap}
body[data-layout="phone"] .modal-back{align-items:end;place-items:end stretch}
body[data-layout="phone"] .modal{width:100%;max-height:88dvh;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
body[data-layout="phone"] #toasts{bottom:calc(78px + env(safe-area-inset-bottom));width:calc(100vw - 24px)}
body[data-layout="phone"] .toast{text-align:center}
body[data-layout="phone"] .bbar{display:flex;flex:none;border-top:1px solid var(--line);background:var(--panel);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body[data-layout="phone"].kbd-open .bbar{display:none}
body[data-layout="phone"].kbd-open #toasts{bottom:12px}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:transparent;color:var(--muted);font-size:11px;position:relative;touch-action:manipulation}
.bb.on{color:var(--accent);font-weight:600}
.bbi{font-size:20px;line-height:1}
.bb .tcount{position:absolute;top:6px;left:calc(50% + 8px);margin:0}
.menu-list{display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 6px;font-size:15px;min-height:50px}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{width:24px;text-align:center;color:var(--muted)}
.menu-item:disabled{opacity:.45}
.tabgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabgrid .btn{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabgrid .btn.on{border-color:var(--accent);color:var(--accent)}
/* 「?」说明 */
.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--accent2);font-size:12px;font-weight:700;margin:0 2px 0 6px;cursor:pointer;padding:0;vertical-align:middle;line-height:1;flex:none}
.help:hover{border-color:var(--accent2)}
@media (pointer: coarse){ .help{width:26px;height:26px;font-size:14px} }
.helppop{position:fixed;z-index:70;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 14px 12px;max-height:70vh;overflow:auto;font-size:13px;line-height:1.6}
.helppop p{margin:4px 0 8px}
.helppop ul,.modal ul{margin:4px 0 8px;padding-left:18px}
.helppop li,.modal li{margin:2px 0}
.helpeg{color:var(--muted)}
.purposebox{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:10px}
.purposebox .purpose{font-weight:600;margin-bottom:4px;white-space:pre-wrap}
.purposebox .hint{white-space:pre-wrap}
.optcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.reqrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px;align-items:start;margin-bottom:6px}
.reqsel{width:100%}
body[data-layout="phone"] .reqrow{grid-template-columns:1fr auto}
body[data-layout="phone"] .reqrow .reqsel{grid-column:1 / -1}
details.reqfold>summary{cursor:pointer;color:var(--accent2);font-size:13px}
details.reqfold[open]>summary{margin-bottom:8px}
.flowwrap{max-height:none;padding:6px 0;margin-bottom:14px}
.flowsvg{display:block;margin:0 auto}
.fnode{cursor:pointer}
.fnode rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.fnode.branch rect{stroke-dasharray:6 4;stroke:var(--accent)}
.fnode.on rect{stroke:var(--accent2);stroke-width:2.5}
.fnode-t{fill:var(--text);font-size:13px;font-weight:600}
.edge{fill:none;stroke-width:1.8}
.e-opt{stroke:var(--accent)} .mk-opt{fill:var(--accent)}
.e-merge{stroke:var(--accent2)} .mk-merge{fill:var(--accent2)}
.e-req{stroke:var(--muted);stroke-dasharray:5 4} .mk-req{fill:var(--muted)}
.e-end{stroke:var(--warn)} .e-end-t{fill:var(--warn)}
.elabel{fill:var(--muted);font-size:11px}
.flowline{padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.flowline:hover{background:var(--sel)}
.flowline:last-child{border-bottom:0}
/* outline */
.outline-head{display:flex;flex-direction:column;padding:2px 12px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.outline-head b{font-size:13px}
.row{display:flex;align-items:center;gap:6px;padding:1px 8px 1px 8px;min-height:29px;cursor:default}
.row.beat{padding-left:30px}
.row:hover{background:var(--panel2)}
.row.selected{background:var(--sel)}
.row.top .label{font-weight:700}
.row.dragging{opacity:.4}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent2)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--accent2)}
.otext{flex:1;min-width:0;border:0;background:transparent;padding:3px 4px;border-radius:3px;outline:none}
.otext:focus{background:var(--panel)}
.row.stage .otext{font-weight:600}
.otext::placeholder{color:var(--muted);font-weight:400}
.num{color:var(--muted);font-size:12px;min-width:30px;cursor:grab;user-select:none;font-variant-numeric:tabular-nums}
.tog{width:14px;text-align:center;color:var(--muted);cursor:pointer;user-select:none;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--warn)}
.chip{font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--muted);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;flex:none}
.chip:empty{display:none}
.chip.cut{background:var(--warnbg);color:var(--warn)}
.kb{font-size:11px;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:3px;color:#fff;flex:none;line-height:1}
.k-see{background:var(--see)} .k-do{background:var(--do)} .k-choose{background:var(--choose)} .k-skip{background:var(--skip)}
.k-none{border:1px dashed var(--muted);color:var(--muted)}
.mb{font-size:12px;color:var(--accent2);flex:none}
.outline-actions{display:flex;gap:6px;padding:8px 12px}
.parkquick{margin:6px 12px 0}
/* forms */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:15px}
.step{color:var(--accent);font-size:12px;margin-right:8px;font-weight:600}
.frow{display:block;margin-bottom:10px;min-width:0}
.flabel{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.hint{color:var(--muted);font-size:12px;font-weight:400}
p.hint{margin:0 0 10px}
.inp,.ta{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 8px;outline:none}
.inp:focus,.ta:focus{border-color:var(--accent2);background:var(--panel)}
.ta{resize:vertical;overflow:hidden;min-height:34px;display:block}
.ta.key{border-color:var(--accent);min-height:52px}
.ta.quote{color:var(--muted);font-style:italic}
.inp.big{font-size:16px;font-weight:600}
.inp.sm{padding:2px 6px;width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
.chain{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:start}
.chain .arrow{text-align:center;padding-top:28px;color:var(--muted)}
.fromto{display:flex;gap:8px;align-items:center}
.formula{display:flex;gap:6px;align-items:center}
.formula .inp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:4px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.warnline{color:var(--warn);font-size:12px;margin:-4px 0 10px}
.warnline:empty{display:none}
.warnrow{display:flex;gap:8px;align-items:center;color:var(--warn);font-size:12px;margin:-4px 0 10px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.lnk{color:var(--accent2);cursor:pointer;margin-right:6px;text-decoration:none}
.lnk:hover{text-decoration:underline}
.refline{padding:4px 6px;border-radius:4px;cursor:pointer}
.refline:hover{background:var(--sel)}
.blist .brow{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:4px;cursor:pointer}
.blist .brow:hover{background:var(--sel)}
details.ask{margin-top:6px;font-size:13px}
details.ask summary{cursor:pointer;color:var(--accent2)}
.laneedit{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.mechrow{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.mechrow .name{min-width:120px;font-weight:600}
.checkline{display:flex;gap:6px;align-items:center;margin-bottom:6px}
/* table */
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.tbl th{background:var(--panel2);font-weight:600;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--sel)}
.tbl tr.selrow{background:var(--sel)}
.ta.cellta{min-height:28px;padding:3px 6px;font-size:12px}
/* lanes */
.lanes-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:calc(100vh - 250px)}
.lg{display:grid;width:max-content}
.lc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;font-size:12px;min-height:36px;background:var(--panel);min-width:0}
.lc.lab{position:sticky;left:0;z-index:2;background:var(--panel2);font-weight:600}
.lc.stagehead{position:sticky;top:0;z-index:1;background:var(--panel2);font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc.stagehead.selstage{background:var(--sel)}
.lc.corner{top:0;z-index:3}
.lc.link{background:var(--link)}
.lc.empty{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--warnbg) 6px 12px)}
.lc.excl{opacity:.45}
.lc.selcol{box-shadow:inset 0 0 0 2px var(--accent2)}
.lc.beatcell{cursor:pointer}
.lc.trend{cursor:pointer;user-select:none;text-align:center}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bnum{display:flex;gap:4px;align-items:center;color:var(--muted)}
.tr{font-weight:700}
.tr-up{color:var(--warn)} .tr-down{color:var(--accent2)} .tr-flat{color:var(--muted)}
.curvecell{padding:0 !important;cursor:crosshair}
svg.curve{display:block}
.ccol{fill:transparent}
.ccol.link{fill:var(--link)} .ccol.empty{fill:var(--warnbg)} .ccol.excl{fill:var(--panel2)} .ccol.selcol{fill:var(--sel)}
.seg-l{stroke:var(--accent2);stroke-width:2}
.seg-l.flat{stroke:var(--warn);stroke-width:3;stroke-dasharray:6 4}
.pt{fill:var(--accent2)}

.crit .mark.y{color:var(--ok)} .crit .mark.n{color:var(--warn)}
.iss{display:flex;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;align-items:flex-start}
.iss:hover{background:var(--sel)}

.lvl.miss{background:var(--warn);color:#fff} .lvl.warn{background:var(--hint);color:#fff} .lvl.info{background:var(--panel2);color:var(--muted)}

.stepno.done{background:var(--ok);color:#fff}
.stepbody{flex:1}
.kbd{font-family:Consolas,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px}

<script>
'use strict';
/* ---------- core（与 CLI 共用：模型、检查、标签、全文） ---------- */
const C = window.ChaipaiCore;
if (!C) { document.body.innerHTML = '<p style="padding:20px">找不到 core.js：它必须和拆拍台.html 放在同一个目录。</p>'; throw new Error('core.js missing'); }
const { uid, short, filled, hashKey, mdEsc, DESIGN_KEYS, ARC, KINDS, KCLS, STEP_NAMES, newDesign, newDoc, newStage, newBeat, newMechanic, normalize, laneFilled, isAct, visitKey } = C;
const allBeats = () => C.allBeats(doc);
const findStage = id => C.findStage(doc, id);
const findBeat = id => C.findBeat(doc, id);
const mechOfBeat = id => C.mechOfBeat(doc, id);
const mapGroups = () => C.mapGroups(doc);
const flatEmotionIds = () => C.flatEmotionIds(doc);
const laneChanges = () => C.laneChanges(doc);
const computeIssues = () => C.computeIssues(doc);
const criteria = () => C.criteria(doc);
const buildMarkdown = () => C.buildMarkdown(doc);
const objLabel = id => C.objLabel(doc, id);
const keyLabel = key => C.keyLabel(doc, key);
/* ---------- 基础工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k !== 'list' && k in el) { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function moveArr(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

/* ---------- 状态 ---------- */
let doc = newDoc();
let sel = { type: 'top' };
let tab = 'detail';
let issues = [];
let tableFilter = { kind: 'all', map: 'all', stage: 'all', bad: false };
let fileHandle = null, fallbackName = '', lastSaved = null, saveError = '', dirty = false, changeSeq = 0;
let undoStack = [], redoStack = [], lastSnap = JSON.stringify(doc);
let snapTimer = null, saveTimer = null, derivedTimer = null;
const FS_OK = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;

function beatHasContent(b) { return [b.reaction, b.result, b.source, b.map, b.kind, b.stuck, ...Object.values(b.formula), ...Object.values(b.cells)].some(filled) || Object.keys(b.lanes).length > 0 || b.cuttable; }
function stageHasContent(s) { return [s.goal, s.start, s.end, s.endCondition, s.loopExit, s.parallelGroup, ...Object.values(s.design)].some(filled); }
function renameMap(oldName, nv) {
  allBeats().forEach(x => { if (x.b.map.trim() === oldName) x.b.map = nv; });
  for (const k of Object.keys(doc.mapVisits)) {
    if (!k.startsWith(oldName + '||')) continue;
    const nk = nv + k.slice(oldName.length);
    const src = doc.mapVisits[k], dst = doc.mapVisits[nk];
    if (dst) { for (const f of ['time', 'light', 'who', 'can']) if (!filled(dst[f])) dst[f] = src[f]; }
    else doc.mapVisits[nk] = src;
    delete doc.mapVisits[k];
  }
}
function pruneRefs() {
  const ids = new Set(allBeats().map(x => x.b.id));
  doc.mechanics.forEach(m => ARC.forEach(([k]) => { m.arc[k] = m.arc[k].filter(id => ids.has(id)); }));
  const laneIds = new Set(doc.lanes.map(l => l.id));
  doc.stages.forEach(s => {
    s.laneExclude = (s.laneExclude || []).filter(id => laneIds.has(id));
    s.beats.forEach(b => { for (const k of Object.keys(b.lanes)) if (!laneIds.has(k)) delete b.lanes[k]; });
  });
  const stageIds = new Set(doc.stages.map(s => s.id));
  doc.parking.forEach(p => { if (p.stageId && !stageIds.has(p.stageId)) p.stageId = ''; });
}
function validateSel() {
  if (sel.type === 'stage' && !findStage(sel.id)) sel = { type: 'top' };
  if (sel.type === 'beat' && !findBeat(sel.id)) sel = { type: 'top' };
}

/* ---------- 改动 / 撤销 ---------- */
function changed() {
  dirty = true; changeSeq++;
  clearTimeout(snapTimer); snapTimer = setTimeout(takeSnapshot, 500);
  clearTimeout(derivedTimer); derivedTimer = setTimeout(refreshDerived, 250);
  scheduleAutosave(); updateStatus(); scheduleLive();
}
function takeSnapshot() {
  clearTimeout(snapTimer); snapTimer = null;
  const s = JSON.stringify(doc);
  if (s !== lastSnap) { undoStack.push(lastSnap); if (undoStack.length > 400) undoStack.shift(); lastSnap = s; redoStack = []; }
}
function mutate(fn) { takeSnapshot(); fn(); pruneRefs(); recordEdit(null); changed(); takeSnapshot(); renderAll(); }
function undo() { takeSnapshot(); if (!undoStack.length) return; redoStack.push(lastSnap); lastSnap = undoStack.pop(); doc = JSON.parse(lastSnap); afterSwap(); }
function redo() { takeSnapshot(); if (!redoStack.length) return; undoStack.push(lastSnap); lastSnap = redoStack.pop(); doc = JSON.parse(lastSnap); afterSwap(); }
function afterSwap() { dirty = true; changeSeq++; validateSel(); renderAll(); updateStatus(); scheduleAutosave(); }

/* ---------- 绑定字段 ---------- */
function field(obj, path, objId, opts = {}) {
  const multi = !!opts.multi;
  const key = `${objId}:${path}`;
  const el = h(multi ? 'textarea' : 'input', {
    class: (multi ? 'ta ' : 'inp ') + (opts.cls || ''), placeholder: opts.ph || '', rows: multi ? (opts.rows || 2) : null,
    dataset: { sync: key, focusKey: 'f:' + key }
  });
  const cur = getPath(obj, path);
  el.value = cur == null ? '' : cur;
  el.addEventListener('input', () => {
    setPath(obj, path, el.value);
    recordEdit(key);
    changed();
    document.querySelectorAll(`[data-sync="${key}"]`).forEach(o => {
      if (o === el) return;
      if (o.tagName === 'INPUT' || o.tagName === 'TEXTAREA') { o.value = el.value; if (o.tagName === 'TEXTAREA') autosize(o); }
      else o.textContent = el.value || o.dataset.empty || '';
    });
    if (multi) autosize(el);
    if (opts.onInput) opts.onInput(el.value);
  });
  if (multi) requestAnimationFrame(() => autosize(el));
  return el;
}
const syncSpan = (key, value, empty) => h('span', { dataset: { sync: key, empty: empty || '' } }, value || empty || '');
const btn = (text, fn, cls, title) => h('button', { class: 'btn ' + (cls || ''), onclick: fn, title }, text);
function seg(opts, cur, on) { return h('div', { class: 'seg' }, opts.map(([v, t]) => h('button', { class: cur === v ? 'on' : '', onclick: () => on(cur === v ? '' : v) }, t))); }
const sec = (title, step, ...children) => h('div', { class: 'sec' }, h('h3', {}, step ? h('span', { class: 'step' }, step) : null, title, helpBtn(title)), ...children);
/* ---------- 每个空旁边的「?」：点开看这是什么、怎么想 ---------- */
const HELP = {

function curveRow(l, seq, changes, flat) {

    if (excl) c.push('excl'); else if (!x.s.beats.some(b => laneFilled(b, l))) c.push('empty');
    if (sel.type === 'beat' && sel.id === x.b.id) c.push('selcol');
    svg.append(S('rect', { x: i * COL, y: 0, width: COL, height: H, class: 'ccol ' + c.join(' ') }));
    if (x.bi === 0 && i > 0) svg.append(S('line', { x1: i * COL, y1: 0, x2: i * COL, y2: H, class: 'stageline' }));
  });

  svg.append(S('line', { x1: 0, x2: n * COL, y1: yOf(0), y2: yOf(0), class: 'zero' }));
  let prev = null;
  seq.forEach((x, i) => {
    const val = x.b.lanes[l.id];
    if (typeof val !== 'number') { prev = null; return; }
    const cx = i * COL + COL / 2, cy = yOf(val);

    prev = { cx, cy, val, id: x.b.id };
  });
  seq.forEach((x, i) => {
    const val = x.b.lanes[l.id]; if (typeof val !== 'number') return;
    svg.append(S('circle', { cx: i * COL + COL / 2, cy: yOf(val), r: 5, class: 'pt' }));
    const t = S('text', { x: i * COL + COL / 2 + 8, y: yOf(val) - 7, class: 'ptlabel' }); t.textContent = (val > 0 ? '+' : '') + val; svg.append(t);

  });

}

/* ---------- GitHub 接口 ---------- */
function ghErrText(status, data) {
  const m = data && data.message ? data.message : '';
  if (status === 401) return '令牌无效或已过期';
  if (status === 403) return /rate limit/i.test(m) ? 'GitHub 接口限流了，过会儿再试' : '令牌没有这个仓库的写权限';
  if (status === 404) return '找不到仓库、分支或文件（也可能是令牌看不到这个仓库）';
  return `GitHub 返回 ${status}${m ? '：' + m : ''}`;
}
async function gh(method, path, body, c = cfg) {
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {
      method, cache: 'no-store',
      headers: Object.assign({ Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { const err = new Error('连不上 GitHub（网络）'); err.status = 0; throw err; }
  const txt = await r.text(); let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!r.ok) {
    const err = new Error(ghErrText(r.status, data)); err.status = r.status; err.data = data;
    err.conflict = r.status === 409 || (r.status === 422 && /sha/i.test((data && data.message) || ''));
    throw err;
  }
  return data;
}
const b64encode = s => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64decode = b => new TextDecoder().decode(Uint8Array.from(atob((b || '').replace(/\s/g, '')), ch => ch.charCodeAt(0)));
const encPath = name => name.split('/').map(encodeURIComponent).join('/');
let branchChecked = false;
async function ensureBranch() {
  if (branchChecked) return;
  try { await gh('GET', `/branches/${encodeURIComponent(cfg.branch)}`); branchChecked = true; return; }
  catch (e) { if (e.status !== 404) throw e; }
  const tree = await gh('POST', '/git/trees', { tree: [{ path: 'README.md', mode: '100644', type: 'blob', content: '# 拆拍台数据\n\n拆拍台（编排/拆拍台.html）的任务文件。手机上的网页直接读写这个分支；电脑上的页面存本机 编排/，并在后台和这里同步。不要手改。\n' }] });
  const commit = await gh('POST', '/git/commits', { message: '拆拍台：建立数据分支', tree: tree.sha, parents: [] });
  await gh('POST', '/git/refs', { ref: `refs/heads/${cfg.branch}`, sha: commit.sha });
  branchChecked = true;
}
async function remoteList() {
  await ensureBranch();
  const t = await gh('GET', `/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
  return t.tree.filter(x => x.type === 'blob' && !x.path.includes('/') && x.path.endsWith(EXT)).map(x => ({ name: x.path, sha: x.sha }));
}
async function remoteGet(name) {
  await ensureBranch();
  try {
    const d = await gh('GET', `/contents/${encPath(name)}?ref=${encodeURIComponent(cfg.branch)}`);
    let text = b64decode(d.content);
    if (!d.content && d.git_url) { const blob = await gh('GET', `/git/blobs/${d.sha}`); text = b64decode(blob.content); }   // 超过 1MB 时 contents 不带正文
    return { sha: d.sha, text };
  } catch (e) { if (e.status === 404) return null; throw e; }
}
async function remotePut(name, text, sha) {
  await ensureBranch();

async function exportMd() {
  const text = buildMarkdown();
  if (!LOCAL_MODE) { download(docName() + '.md', text, 'text/markdown'); toast('已下载 Markdown', 'ok'); return; }
  if (!(await ensureProject())) return;
  try {
    const hd = await window.showSaveFilePicker({ startIn: projDir, suggestedName: docName() + '.md', types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    const w = await hd.createWritable(); await w.write(text); await w.close();
    toast('已导出 ✓　' + hd.name, 'ok');
  } catch (e) { if (e.name !== 'AbortError') toast('导出失败：' + e.message, 'err'); }
}

/* ---------- 现场同步（电脑）：把页面实时状态写进项目，供任何 agent 通过 chaipai 只读感知 ---------- */
let liveTimer = null, liveBusy = false, livePending = false, liveErr = '', liveAt = null, liveBaseLast = '';
const recent = [];
const TAB_LABEL = Object.fromEntries(TABS);
function recordEdit(key) {
  const now = Date.now();
  if (recent.length && recent[0].key === key) recent[0].time = now;
  else { recent.unshift({ key, time: now }); if (recent.length > 30) recent.pop(); }
}
/* 快照只是页面 → CLI 的内部传输：agent 一律通过 chaipai CLI 读，不直接读这些文件。页面从不回读快照。 */
const LIVE_SUBDIR = '.live';
const LIVE_SCHEMA = 1;
const LIVE_HEARTBEAT_SEC = 15;
const liveSession = uid();
let liveSeq = 0, liveSig = '', liveWrittenAt = null;
function liveBase() { return (curName ? baseName(curName) : docName() + '（未存盘）').replace(/[\\/:*?"<>|]/g, '_'); }
function liveState() {
  const a = document.activeElement; const fk = a && a.dataset ? a.dataset.sync : null;
  return {
    file: curName, unsaved: dirty || !curName, pageVisible: document.visibilityState === 'visible',
    tab: TAB_LABEL[tab], selection: { type: sel.type, id: sel.id || null }, focusKey: fk || null,
    recentEdits: recent.map(r => ({ key: r.key, at: new Date(r.time).toISOString() })),
    githubSync: ghReady() ? sync.state : 'off'
  };
}
function scheduleLive() { if (!LOCAL_MODE || !projDir || projState !== 'ok') return; clearTimeout(liveTimer); liveTimer = setTimeout(writeLive, 600); }
async function writeLive() {
  if (!LOCAL_MODE || !projDir || projState !== 'ok') return;
  if (liveBusy) { livePending = true; return; }
  liveBusy = true;
  try {
    if ((await projDir.queryPermission({ mode: 'readwrite' })) !== 'granted') { projState = 'need-permission'; return; }
    const dir = await projDir.getDirectoryHandle(LIVE_SUBDIR, { create: true });
    const base = liveBase(); const st = liveState(); const nowIso = new Date().toISOString();
    const sig = JSON.stringify([st, doc]);
    if (sig !== liveSig) { liveSeq++; liveSig = sig; liveWrittenAt = nowIso; }
    const payload = { schema: LIVE_SCHEMA, app: '拆拍台', sessionId: liveSession, seq: liveSeq, writtenAt: liveWrittenAt, heartbeatAt: nowIso, heartbeatIntervalSec: LIVE_HEARTBEAT_SEC, ...st, doc };
    const fh = await dir.getFileHandle(base + '.json', { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(payload)); await w.close();
    if (liveBaseLast && liveBaseLast !== base) { try { await dir.removeEntry(liveBaseLast + '.json'); } catch (e) { } }
    liveBaseLast = base; liveAt = new Date(); liveErr = '';
  } catch (e) { liveErr = '出错：' + e.message; }
  finally { liveBusy = false; updateProj(); if (livePending) { livePending = false; scheduleLive(); } }
}

/* ---------- 启动 ---------- */
$('#bNew').onclick = () => {
  if (!curName && dirty) { if (!confirm('当前新任务还没保存，丢掉？')) return; idbDel(draftKey(null)); }
  loadDoc(newDoc());
};
$('#bOpen').onclick = openFile;
$('#bReopen').onclick = openLast;
$('#bSave').onclick = () => saveFile(false);
$('#bSaveAs').onclick = () => saveFile(true);
$('#bMd').onclick = exportMd;
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bProj').onclick = onProjButton;
$('#bSync').onclick = () => openSettings(false);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal')) { closeModal(); return; }
  const mod = e.ctrlKey || e.metaKey; if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveFile(e.shiftKey); }
  else if (k === 'o') { e.preventDefault(); openFile(); }
  else if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
});
window.addEventListener('beforeunload', e => { if (dirty && LOCAL_MODE && !fileHandle) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('focusin', scheduleLive);
document.addEventListener('visibilitychange', () => { scheduleLive(); if (document.visibilityState === 'visible' && curName && ghReady()) syncCurrent({ pullOnly: true }); });
setInterval(() => { if (LOCAL_MODE && projDir && projState === 'ok' && !liveErr) writeLive(); }, LIVE_HEARTBEAT_SEC * 1000);
setInterval(() => { if (curName && ghReady() && document.visibilityState === 'visible') syncCurrent({ pullOnly: true }); }, PULL_EVERY);
applyLayout();
kbdCheck();
renderAll();
updateProj();
(async () => {
  const c = await idbGet('ghcfg'); if (c) cfg = Object.assign({}, CFG_DEFAULT, c);
  if (!(await idbGet('lastName'))) { const old = await idbGet('lastHandle'); if (old && old.name) await idbSet('lastName', old.name); }
  updateStatus();
  // 上次没保存的新任务草稿，优先恢复
  const nd = await idbGet(draftKey(null));
  const ndHasContent = nd && nd.doc && ((nd.doc.stages && nd.doc.stages.length) || (nd.doc.meta && nd.doc.meta.title && nd.doc.meta.title !== '未命名任务') || C.filled(nd.doc.synopsis));
  if (FS_OK) {
    const d = await idbGet('projDir');
    if (d) {
      projDir = d;
      try { projState = (await d.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'need-permission'; }
      catch (e) { projDir = null; projState = 'none'; }
    }
    refreshMode();
    if (projState === 'ok') await afterProjectReady();
    updateProj(); updateStatus();
  }
  if (ndHasContent) { startupOpened = true; loadDoc(nd.doc); dirty = true; updateStatus(); toast('恢复了上次没保存的新任务', 'info'); return; }
  if (LOCAL_MODE) {
    if (projState === 'ok') await openLastIfIdle();
    else if (await idbGet('lastName')) { const b = $('#bReopen'); b.hidden = false; b.textContent = '打开上次：' + baseName(await idbGet('lastName')); }
  } else if (ghReady()) await openLastIfIdle();
  else if (!FS_OK) openSettings(true);   // 手机：必须先设 GitHub；电脑：不打扰，保存或打开时再让你选
})();
</script>
