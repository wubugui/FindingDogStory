<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主线电影概念图库 · GPT Image</title>
  <style>
    :root{color-scheme:dark;--bg:#14130f;--panel:#24211b;--line:#474032;--text:#f5efe2;--muted:#b3a893;--gold:#e0b875}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    button,input{font:inherit}button{cursor:pointer}
    header{padding:clamp(24px,4vw,52px) clamp(16px,5vw,76px) 28px;background:linear-gradient(125deg,#2c251b,#151411 62%);border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 10px;color:var(--gold);letter-spacing:.17em;font-size:12px}
    h1{margin:0;font-size:clamp(30px,4.2vw,52px);line-height:1.2}
    header p{max-width:900px;margin:12px 0 0;color:var(--muted)}
    .notice{color:var(--text);font-weight:600}
    nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px clamp(16px,5vw,76px);background:#1a1814f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    nav button,input{background:#302b22;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
    nav button.active{border-color:var(--gold);color:var(--gold)}
    nav input{margin-left:auto;min-width:200px;width:min(280px,100%)}
    nav .count{color:var(--gold);white-space:nowrap}
    main{padding:28px clamp(16px,5vw,76px) 90px}
    section{margin-bottom:48px}
    .section-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 20px;margin:0 0 18px;border-bottom:1px solid var(--line)}
    h2{font-size:25px;margin:0 0 10px}
    .section-head p{margin:0 0 10px;color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
    .card>button{display:block;padding:0;border:0;width:100%;background:#0f0e0c}
    .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}
    .meta{padding:13px 15px 16px}
    .id{color:var(--gold);font-size:12px;letter-spacing:.08em}
    h3{font-size:17px;line-height:1.35;margin:3px 0 7px}
    .meta p{font-size:13px;color:var(--muted);margin:0 0 9px}
    .basis{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:11px;color:#d5c6a9}
    .empty{padding:50px;color:var(--muted)}
    dialog{position:fixed;inset:2vh 2vw;margin:auto;padding:0;width:min(1580px,96vw);height:96vh;max-width:none;max-height:none;color:var(--text);background:#11100d;border:1px solid var(--line);border-radius:10px}
    dialog::backdrop{background:#000d}
    .viewer{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
    .viewer-bar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
    .viewer-bar:last-child{border-top:1px solid var(--line);border-bottom:0}
    .viewer-bar button{background:#302b22;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 10px}
    #viewerTitle{flex:1;overflow-wrap:anywhere}
    .viewer-frame{display:grid;place-items:center;overflow:auto;min-height:0}
    .viewer-frame img{max-width:100%;max-height:100%;object-fit:contain}
    #viewerNote{flex:1;color:var(--muted);font-size:13px}
    a{color:var(--gold)}
    @media(max-width:650px){nav input{margin-left:0;flex:1}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}h3{font-size:15px}.meta{padding:10px}.viewer-bar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">FINDING DOG STORY · VISUAL STORY</p>
    <h1>主线电影概念图库</h1>
    <p class="notice">GPT Image 版本 · 已完成概念图 · 2026-10-01</p>
    <p>本次先发布已完成并入选的 29 张电影概念图（含早前 20 张与本轮归档 9 张），按 Demo 流程、正式版进山和李天狗生平排列。山口救人图在两条时间线共用。点击图片可放大，方向键连续浏览。</p>
    <p>阿秀图组待新版设定对齐后并入。正式版其余节点与 Demo 细分转折仍待补齐；地图未定的画面已在图下注明。含剧情剧透。</p>
  </header>
  <nav aria-label="图库筛选">
    <button type="button" data-section="all" class="active">全部</button>
    <button type="button" data-section="demo">Demo 流程</button>
    <button type="button" data-section="formal">正式版主线</button>
    <button type="button" data-section="li">李天狗生平</button>
    <input id="search" type="search" placeholder="搜索剧情或编号" aria-label="搜索剧情或编号">
    <span id="count" class="count"></span>
  </nav>
  <main id="main"></main>
  <dialog id="dialog"><div class="viewer">
    <div class="viewer-bar"><button id="prev" type="button" aria-label="上一张">←</button><strong id="viewerTitle"></strong><button id="next" type="button" aria-label="下一张">→</button><button id="close" type="button">关闭</button></div>
    <div class="viewer-frame"><img id="viewerImage" alt=""></div>
    <div class="viewer-bar"><span id="viewerNote"></span><a id="original" target="_blank" rel="noopener">打开原图</a></div>
  </div></dialog>
  <script id="image-data" type="application/json">[{"s":"demo","id":"G1","t":"雾津街头讨生活","d":"关二狗的日常处境：靠零活、脏活和吹牛混饭。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/G1_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D01","t":"茶馆听书","d":"李天狗镇旱魃的传闻，成为关二狗后续吹牛的话本。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D01_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D02","t":"后巷接夜背尸活","d":"收下定金，记住莫回头、莫灭灯、有人喊莫张视。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D02_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D03","t":"赌坊输光定金","d":"输光、被赶出门，只能为另一半工钱上山。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D03_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D04","t":"深夜跑马梁","d":"空山路、弱火光，第一次真正进入禁忌。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D04_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D05","t":"崖墓背尸","d":"瘦尸沉得反常，重量与恐惧一起压上来。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D05_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D05b","t":"背尸鬼打墙","d":"背着沉重瘦尸绕行，石碑与歪松仿佛再次出现。","p":"资料/主线视觉图集_2026-09-29/gpt_mainline/D05b_背尸鬼打墙_concept.png","a":"崖墓场景参考 · 旧流程氛围概念"},{"s":"demo","id":"D05c","t":"逃亡拾得帕子包","d":"逃命途中拾起旧帕子包；具体拾取镜位尚待落地。","p":"资料/主线视觉图集_2026-09-29/gpt_mainline/D05c_逃亡拾得帕子包_concept.png","a":"崖墓场景参考 · 拾取镜位未定"},{"s":"demo","id":"D06","t":"牛头凼坠潭","d":"逃亡失足坠入深潭，濒死引出待死之礼。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D06_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D06b","t":"深潭第一次濒死","d":"沉入幽暗潭水，濒死时第一次出现死亡系绳的信号。","p":"资料/主线视觉图集_2026-09-29/gpt_mainline/D06b_深潭第一次濒死_concept.png","a":"深潭环境概念"},{"s":"demo","id":"D07a","t":"梦中倒头饭","d":"老两口和善招待，筷子直插饭中。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D07a_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D07b","t":"白纸盖脸","d":"待死之礼收束：白纸随呼吸起伏。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D07b_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D08","t":"城外土路醒来","d":"两天后醒来，关二狗只觉得饿。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D08_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D09","t":"婆子家第一单","d":"观察人脸色，拿说书词装神弄鬼后收钱。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D09_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D10","t":"河边递纸","d":"身后有人递纸，回头无人，手里却是纸钱。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D10_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D11","t":"码头黑水捞箱","d":"洋人夫妇的箱子落水，关二狗下水捞取。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D11_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D11b","t":"码头水下再遇险","d":"捞箱时遭遇水下危险，关二狗挣扎着向水面求生。","p":"资料/主线视觉图集_2026-09-29/gpt_mainline/D11b_码头水下再遇险_concept.png","a":"码头环境参考 · 水下概念"},{"s":"demo","id":"D12","t":"置办假道士行头","d":"在雾津搜集旧道袍、罗盘、桃木剑与符纸。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D12_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D13","t":"阎王岭去程喊名","d":"随脚帮送货，按指定地点向林子喊名字。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D13_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D14","t":"独行夜返","d":"被喊醒的东西反过来叫二狗，必须忍住应声。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D14_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D15","t":"李天狗山口救人","d":"关二狗命悬一线，真正的道士从雾中把他拎出。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D15_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D16","t":"克拉拉街头招募","d":"她记下几次异常，认定关二狗能带路进山。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D16_concept.png","a":"现有场景与角色参考"},{"s":"demo","id":"D17","t":"拂晓城门汇合","d":"关二狗与克拉拉、埃德加出城，Demo 止于雾路。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D17_concept.png","a":"现有场景与角色参考"},{"s":"formal","id":"M01","t":"进山寻找阴石","d":"关二狗带克拉拉和埃德加进入神仙顶；本图表达进山氛围，具体地貌与逐关顺序未定。","p":"资料/主线视觉图集_2026-09-29/gpt_mainline/M01_进山寻阴石_concept.png","a":"剧情概念 · 地图未定"},{"s":"li","id":"L1","t":"山路独行","d":"说书神仙背后，是常年在荒山行走的手艺人。","p":"资料/主线视觉图集_2026-09-29/gpt_li/L1_山路独行_电影概念.png","a":"现有山口与角色参考"},{"s":"li","id":"L2","t":"码头读衣","d":"从无名死者衣物的针线、磨损与改动中追索来路。","p":"资料/主线视觉图集_2026-09-29/gpt_li/L2_码头读衣_电影概念.png","a":"现有码头与角色参考"},{"s":"li","id":"L3","t":"义庄记名","d":"为无名死者留下记录，呈现李天狗的丧葬手艺。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/L3_concept.png","a":"现有义庄与角色参考"},{"s":"li","id":"L4","t":"炸潭未及","d":"山体和沉尸潭被炸毁，李天狗试图阻止却没有赶上。","p":"资料/主线视觉图集_2026-09-29/gpt_li/L4_炸潭未及_电影概念.png","a":"剧情概念 · 地图未定"},{"s":"li","id":"L5","t":"灾后查煞","d":"此后多年，他仍在桃溪周边寻找化解方法。","p":"资料/主线视觉图集_2026-09-29/gpt_li/L5_灾后查煞_电影概念.png","a":"剧情概念 · 地图未定"},{"s":"li","id":"L6","t":"山口救关二狗","d":"与 Demo 山口救人共用同一幅概念图。","p":"资料/主线视觉图集_2026-09-24/gpt_image/accepted/D15_concept.png","a":"与 Demo D15 共用"}]</script>
  <script>
    "use strict";
    const items=JSON.parse(document.getElementById("image-data").textContent);
    const groups=[
      ["demo","Demo 流程","按必经事件与关键氛围顺序；同一拍可能有多个转折镜头。"],
      ["formal","正式版 · 进山","本次先展示已入选的进山概念；其余剧情节点待后续补齐。"],
      ["li","李天狗生平","从山路手艺人到灾后调查、Demo 山口救人。"]
    ];
    const ui={main:document.getElementById("main"),search:document.getElementById("search"),count:document.getElementById("count"),dialog:document.getElementById("dialog"),image:document.getElementById("viewerImage"),title:document.getElementById("viewerTitle"),note:document.getElementById("viewerNote"),original:document.getElementById("original")};
    let section="all",visible=[],selected=0;
    function imageURL(x){
      if(location.protocol==="file:")return "../"+x.p.slice("资料/".length).split("/").map(encodeURIComponent).join("/");
      return "https://raw.githubusercontent.com/wubugui/FindingDogStory/main/"+x.p.split("/").map(encodeURIComponent).join("/");
    }
    function render(){
      const q=ui.search.value.trim().toLocaleLowerCase();
      visible=items.filter(x=>(section==="all"||x.s===section)&&(!q||(x.id+" "+x.t+" "+x.d).toLocaleLowerCase().includes(q)));
      ui.main.replaceChildren();
      for(const [key,title,description] of groups){
        const group=visible.filter(x=>x.s===key);if(!group.length)continue;
        const sec=document.createElement("section"),head=document.createElement("div"),h=document.createElement("h2"),info=document.createElement("p"),grid=document.createElement("div");
        head.className="section-head";h.textContent=title;info.textContent=description;grid.className="grid";head.append(h,info);sec.append(head,grid);
        for(const x of group){
          const card=document.createElement("article"),button=document.createElement("button"),img=document.createElement("img"),meta=document.createElement("div"),id=document.createElement("span"),name=document.createElement("h3"),desc=document.createElement("p"),basis=document.createElement("span");
          card.className="card";button.type="button";button.setAttribute("aria-label","放大 "+x.id+" "+x.t);
          img.src=imageURL(x);img.alt=x.id+" "+x.t;img.loading="lazy";img.decoding="async";button.append(img);button.onclick=()=>show(visible.indexOf(x));
          meta.className="meta";id.className="id";id.textContent=x.id;name.textContent=x.t;desc.textContent=x.d;basis.className="basis";basis.textContent=x.a;meta.append(id,name,desc,basis);card.append(button,meta);grid.append(card);
        }
        ui.main.append(sec);
      }
      if(!visible.length){const p=document.createElement("p");p.className="empty";p.textContent="没有匹配的概念图";ui.main.append(p)}
      ui.count.textContent="显示 "+visible.length+" / "+items.length+" 个节点";
    }
    function show(n){
      if(n<0||n>=visible.length)return;selected=n;const x=visible[n],url=imageURL(x);
      ui.image.src=url;ui.image.alt=x.id+" "+x.t;ui.title.textContent=x.id+" · "+x.t;ui.note.textContent=x.d+" · "+x.a;ui.original.href=url;
      document.getElementById("prev").disabled=n===0;document.getElementById("next").disabled=n===visible.length-1;
      if(!ui.dialog.open)ui.dialog.showModal();
    }
    document.querySelectorAll("nav button[data-section]").forEach(b=>b.onclick=()=>{section=b.dataset.section;document.querySelectorAll("nav button[data-section]").forEach(v=>v.classList.toggle("active",v===b));render()});
    ui.search.oninput=render;document.getElementById("prev").onclick=()=>show(selected-1);document.getElementById("next").onclick=()=>show(selected+1);document.getElementById("close").onclick=()=>ui.dialog.close();
    document.addEventListener("keydown",e=>{if(!ui.dialog.open)return;if(e.key==="ArrowLeft")show(selected-1);if(e.key==="ArrowRight")show(selected+1)});
    render();
  </script>
</body>
</html>
